<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<script>/* apply the chosen theme before anything is drawn (no flash) */
try { const t = JSON.parse(localStorage.getItem('sermon-notes-v1'))?.settings?.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-c: #14161C; --slate: #5A6070; --mist: #E6E8EE; --paper: #FAF9F6;
    --bg: color-mix(in srgb, #E6E8EE 45%, #FAF9F6); --panel: #FAF9F6; --solid: #FAF9F6; --ink: #14161C; --muted: #5A6070;
    --line: #E6E8EE; --field: color-mix(in srgb, #FAF9F6 55%, #ffffff); --danger: #b3261e;
    --sunrise: #14161C; --brand: #14161C; --brand2: #5A6070; --on-brand: #FAF9F6; --accent: #5A6070;
    --soft: #E6E8EE; --radius: 16px; --shadow: 0 1px 2px rgba(20,22,28,.05), 0 8px 24px -14px rgba(20,22,28,.22);
    --c: #14161C; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #14161C; --panel: color-mix(in srgb, #5A6070 10%, #14161C); --solid: color-mix(in srgb, #5A6070 10%, #14161C);
    --ink: #FAF9F6; --muted: color-mix(in srgb, #E6E8EE 72%, #5A6070); --line: color-mix(in srgb, #5A6070 40%, #14161C);
    --field: color-mix(in srgb, #5A6070 6%, #14161C); --brand: #E6E8EE; --on-brand: #14161C; --accent: color-mix(in srgb, #E6E8EE 75%, #5A6070);
    --soft: color-mix(in srgb, #5A6070 22%, #14161C); --danger: #e5786d;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.8); color-scheme: dark; --c: #E6E8EE; } }
  :root[data-theme="dark"] {
    --bg: #14161C; --panel: color-mix(in srgb, #5A6070 10%, #14161C); --solid: color-mix(in srgb, #5A6070 10%, #14161C);
    --ink: #FAF9F6; --muted: color-mix(in srgb, #E6E8EE 72%, #5A6070); --line: color-mix(in srgb, #5A6070 40%, #14161C);
    --field: color-mix(in srgb, #5A6070 6%, #14161C); --brand: #E6E8EE; --on-brand: #14161C; --accent: color-mix(in srgb, #E6E8EE 75%, #5A6070);
    --soft: color-mix(in srgb, #5A6070 22%, #14161C); --danger: #e5786d;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 26px -16px rgba(0,0,0,.8); color-scheme: dark; --c: #E6E8EE; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin:0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    color: var(--ink); background: transparent; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
  header { flex:none; }
  .toast { position:fixed; left:50%; bottom:22px; z-index:120; max-width:min(92vw,520px); padding:12px 18px; border-radius:14px;
    background:#3a2e24; color:#fff8ee; font-weight:700; box-shadow: 0 14px 34px -10px rgba(0,0,0,.5);
    transform: translateX(-50%); animation: toast-in .45s cubic-bezier(.3,1.4,.5,1); }
  .toast.out { animation: toast-out .35s ease-in forwards; }
  @keyframes toast-in { from { opacity:0; transform: translate(-50%, 24px) scale(.95); } }
  @keyframes toast-out { to { opacity:0; transform: translate(-50%, 16px); } }
  h1, h2, h3, .title-input { font-family: "Lora", Georgia, "Inter", system-ui, sans-serif; }

  header { display:flex; align-items:center; gap:10px; padding:12px 20px; background: var(--sunrise);
    background-size: 260% 260%; animation: drift 18s ease-in-out infinite alternate;
    color:#fff; position:sticky; top:0; z-index:5; box-shadow: 0 4px 20px -6px rgba(140,70,35,.45); }
  header h1 { font-size:1.45rem; margin:0; letter-spacing:.01em; display:flex; align-items:center; gap:8px;
    text-shadow: 0 2px 8px rgba(0,0,0,.15); }
  header h1 .logo { display:grid; place-items:center; width:36px; height:36px; border-radius:12px;
    background: rgba(255,255,255,.25); font-size:1.15rem; animation: halo 4s ease-in-out infinite; }
  header h1 .logo svg { width:22px; height:22px; stroke-width:2.2; }
  @keyframes drift { from { background-position: 0% 40%; } to { background-position: 100% 60%; } }
  @keyframes halo { 50% { box-shadow: 0 0 0 6px rgba(255,236,190,.18), 0 0 18px 2px rgba(255,236,190,.35); } }
  header .spacer { flex:1; }
  header button { background: rgba(255,255,255,.2); color:#fff; border-color: rgba(255,255,255,.45); }
  header button:hover { background: rgba(255,255,255,.32); border-color:#fff; }
  header button.primary { background:#fffcf6; color:#9c4a2f; border-color:#fffcf6; }
  header button.primary:hover { background:#fff; }

  button { position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; gap:.4em;
    white-space:nowrap; font:inherit; font-weight:700; cursor:pointer; border:2px solid var(--line); background:var(--panel);
    color:var(--ink); border-radius:999px; padding:7px 15px; transition: transform .15s, box-shadow .15s, background .15s; }
  button:hover { border-color: var(--c); transform: translateY(-1px); }
  button:active { transform: translateY(1px) scale(.98); }
  button.primary { background: linear-gradient(120deg, var(--brand2), var(--brand)); color:#fff; border-color:transparent;
    box-shadow: 0 6px 16px -6px rgba(181,82,59,.55); }
  button.danger { color:var(--danger); }
  button.icon { padding:6px 9px; }
  .ripple { position:absolute; border-radius:50%; background:currentColor; opacity:.22; transform:scale(0);
    pointer-events:none; animation: ripple .65s ease-out forwards; }
  @keyframes ripple { to { transform:scale(1); opacity:0; } }

  /* hand-drawn icons */
  svg.ic { width:1.15em; height:1.15em; flex:none; fill:none; stroke:currentColor; stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round; overflow:visible; }
  svg.ic .fill { fill:currentColor; stroke:none; }
  .draw svg.ic > *, svg.ic.draw-now > *, .editor.anim .badge svg.ic > * { animation: ink 1.1s cubic-bezier(.6,0,.2,1) both; }
  .draw svg.ic > :nth-child(2), svg.ic.draw-now > :nth-child(2), .editor.anim .badge svg.ic > :nth-child(2) { animation-delay: .15s; }
  .draw svg.ic > :nth-child(n+3), svg.ic.draw-now > :nth-child(n+3), .editor.anim .badge svg.ic > :nth-child(n+3) { animation-delay: .3s; }
  .editor.anim .card .badge svg.ic > * { animation-duration: 1.4s; }
  @keyframes ink { from { stroke-dasharray:1 1; stroke-dashoffset:1; } to { stroke-dasharray:1 1; stroke-dashoffset:0; } }
  #sumBtn:hover svg.ic { animation: twirl .8s ease; }
  @keyframes twirl { to { transform: rotate(180deg) scale(1.1); } }
  .big-ic { width:44px !important; height:44px !important; color: var(--brand); stroke-width:1.4 !important; margin-bottom:6px; }
  dialog h3 { display:flex; align-items:center; gap:8px; }
  dialog h3 svg.ic { color: var(--brand); width:22px; height:22px; }
  .note-item .m svg.ic, .pill-ampm svg.ic { width:1em; height:1em; vertical-align:-.15em; }
  input, select, textarea { font:inherit; color:var(--ink); background:var(--field);
    border:2px solid var(--line); border-radius:12px; padding:9px 12px; width:100%; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline:none; border-color: var(--c);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent); }
  textarea { resize:vertical; min-height:80px; line-height:1.55; }
  label { font-size:.75rem; color:var(--muted); font-weight:800; text-transform:uppercase;
    letter-spacing:.06em; display:block; margin-bottom:6px; }

  .layout { display:grid; grid-template-columns: 320px 1fr; flex:1; min-height:0; }
  aside { overflow:auto; background: color-mix(in srgb, var(--panel) 85%, transparent);
    border-right:2px solid var(--line); backdrop-filter: blur(6px); }
  .filters { padding:14px; display:grid; gap:8px; border-bottom:2px solid var(--line);
    position:sticky; top:0; background:var(--panel); z-index:1; --c: var(--brand); }
  .filters .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  #noteList { padding:10px; display:grid; gap:8px; }
  .note-item { --h: 280; padding:12px 14px; cursor:pointer; border-radius:14px; background:var(--panel);
    border:2px solid var(--line); border-left:6px solid hsl(var(--h) 40% 50%); transition: transform .15s, box-shadow .15s; }
  .note-item:hover { transform: translateX(3px); box-shadow: var(--shadow); }
  .note-item.active { border-color: hsl(var(--h) 40% 50%); background: hsl(var(--h) 40% 95%);
    box-shadow: 0 6px 18px -8px hsl(var(--h) 40% 35% / .5); }
  .note-item .t { font-weight:800; margin-bottom:5px; }
  .note-item .m { font-size:.8rem; color:var(--muted); margin-top:3px; }
  .tag { --h: 280; display:inline-block; font-size:.72rem; font-weight:800; padding:2px 9px; border-radius:999px;
    background: hsl(var(--h) 38% 89%); color: hsl(var(--h) 45% 28%); }
  .pill-ampm { display:inline-block; font-size:.72rem; font-weight:800; padding:2px 8px; border-radius:999px; margin-right:4px; }
  .pill-ampm.am { background:#f4e3bd; color:#87560f; }
  .pill-ampm.pm { background:#dfe3e6; color:#3e4c5e; }

  .empty { padding:30px; text-align:center; color:var(--muted); }
  .note-item.in, .empty.in { animation: slide-in .5s cubic-bezier(.3,1.3,.5,1) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes slide-in { from { opacity:0; transform: translateX(-24px) scale(.97); } }
  .note-item.born { animation: born .7s cubic-bezier(.3,1.5,.5,1) both; }
  @keyframes born { 0% { opacity:0; transform: translateY(-14px) scale(.85); } 60% { box-shadow: 0 0 0 6px hsl(var(--h) 45% 55% / .35); } }

  main { overflow:auto; padding:26px; }
  .editor { max-width: 880px; margin:0 auto; display:grid; gap:20px; }
  .card { --c: #b5523b; background:var(--panel); border:2px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; box-shadow: var(--shadow); position:relative; overflow:hidden; }
  .editor.anim .card { animation: pop .4s ease both; }
  .editor.anim .card:nth-child(2) { animation-delay: .04s; } .editor.anim .card:nth-child(3) { animation-delay: .08s; }
  .editor.anim .card:nth-child(4) { animation-delay: .12s; } .editor.anim .card:nth-child(5) { animation-delay: .16s; }
  .editor.anim .card:nth-child(n+6) { animation-delay: .2s; }
  .card::before { content:""; position:absolute; inset:0 0 auto 0; height:5px; background: var(--c); }
  .card h2 { font-size:1.15rem; font-weight:600; margin:2px 0 14px; display:flex; align-items:center; gap:10px; }
  .card h2 .badge { display:grid; place-items:center; width:36px; height:36px; border-radius:12px; font-size:1.1rem;
    background: color-mix(in srgb, var(--c) 16%, transparent); }
  .card h2 .spacer { flex:1; }
  .card h2 button { font-family: "Inter", system-ui, sans-serif; font-size:.85rem; color: var(--c); }
  .card.c-main { --c: #b5523b; } .card.c-main::before { background: var(--sunrise); height:7px; }
  .card.c-dict { --c: #b5523b; } .card.c-speak { --c: #a86f5c; } .card.c-scrip { --c: #557487; }
  .card.c-notes { --c: #6f8b62; } .card.c-act { --c: #7d8b3a; } .card.c-pray { --c: #c58a2c; }
  @keyframes pop { from { opacity:0; transform: translateY(18px) scale(.98); } to { opacity:1; transform:none; } }
  .card { transition: box-shadow .35s, border-color .35s, transform .35s; }
  .card::before { transition: height .35s cubic-bezier(.3,1.4,.5,1); }
  .card:focus-within { border-color: color-mix(in srgb, var(--c) 45%, var(--line));
    box-shadow: 0 14px 34px -14px color-mix(in srgb, var(--c) 60%, transparent); }
  .card:focus-within::before { height:9px; }
  .card h2 .badge { color: var(--c); transition: transform .3s; }
  .card h2 .badge svg.ic { width:22px; height:22px; }
  .card:focus-within h2 .badge { animation: bob .7s cubic-bezier(.3,1.6,.5,1); }
  .card h2 .badge:hover { transform: rotate(-8deg) scale(1.08); }
  @keyframes bob { 40% { transform: translateY(-5px) rotate(-6deg); } }
  .fresh { animation: grow-in .55s cubic-bezier(.3,1.5,.5,1); }
  @keyframes grow-in { from { opacity:0; transform: scale(.92) translateY(-6px); }
    60% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 25%, transparent); } }
  #sumExtras button { animation: grow-in .5s cubic-bezier(.3,1.5,.5,1); }
  .shine-wrap { position:relative; border-radius:12px; overflow:hidden; }
  .shine-wrap textarea { display:block; }
  .shine-wrap.shine::after { content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(100deg, transparent 30%, rgba(255,232,180,.6) 50%, transparent 70%);
    transform: translateX(-100%); animation: sweep 1.2s ease .1s forwards; }
  @keyframes sweep { to { transform: translateX(100%); } }
  .seed { position:fixed; z-index:60; pointer-events:none; }
  .seed svg { display:block; }

  .title-input { font-size:1.8rem; font-weight:600; border:none !important; box-shadow:none !important;
    background:transparent; padding:4px 0; }
  .title-input::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
  .grid3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:14px; }
  .seg { position:relative; display:grid; grid-template-columns:1fr 1fr; background:var(--field);
    border:2px solid var(--line); border-radius:999px; padding:4px; }
  .seg::before { content:""; position:absolute; top:4px; bottom:4px; left:4px; width:calc(50% - 4px); border-radius:999px;
    background: linear-gradient(120deg, #e6c06a, #cf8a3e); box-shadow: 0 4px 12px -4px rgba(207,138,62,.7);
    transition: transform .55s cubic-bezier(.5,1.6,.4,1), background .5s, box-shadow .5s; }
  .seg.pm::before { transform: translateX(100%); background: linear-gradient(120deg, #4c5d70, #6e5a63);
    box-shadow: 0 4px 12px -4px rgba(76,93,112,.7); }
  .seg button { position:relative; z-index:1; border:none; padding:6px; background:transparent; overflow:visible;
    transition: color .4s; box-shadow:none; }
  .seg button:hover { transform:none; }
  .seg button.on[data-p="AM"] { color:#3e2408; }
  .seg button.on[data-p="PM"] { color:#fff; }
  .seg button.on[data-p="AM"] svg.ic { animation: sunspin 1.2s cubic-bezier(.3,1.3,.5,1); }
  .seg button.on[data-p="PM"] svg.ic { animation: moonrock 1.2s ease; }
  @keyframes sunspin { from { transform: rotate(-120deg) scale(.6); } }
  @keyframes moonrock { 0% { transform: rotate(40deg) scale(.6); } 50% { transform: rotate(-14deg); } 75% { transform: rotate(6deg); } }

  .speaker-row { display:grid; grid-template-columns: 1.4fr 1fr auto; gap:8px; margin-bottom:8px; }
  .section { border:2px dashed color-mix(in srgb, var(--c) 35%, var(--line)); border-radius:14px; padding:12px; margin-bottom:12px;
    background: color-mix(in srgb, var(--c) 4%, transparent); }
  .section-head { display:flex; gap:8px; margin-bottom:8px; }
  .section-head input { font-weight:800; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .saved { font-size:.82rem; color:var(--muted); font-weight:600; }

  dialog { border:none; border-radius:var(--radius); background:var(--panel); --c: var(--brand);
    color:var(--ink); max-width:480px; width:92%; box-shadow: 0 20px 60px -10px rgba(0,0,0,.4); padding:22px; }
  dialog h3 { margin:6px 0 10px; }
  dialog::backdrop { background: rgba(45, 28, 12, .45); backdrop-filter: blur(3px); animation: fade .3s ease; }
  dialog[open] { animation: dlg-in .45s cubic-bezier(.3,1.4,.5,1); }
  @keyframes dlg-in { from { opacity:0; transform: translateY(24px) scale(.94); } }
  @keyframes fade { from { opacity:0; } }
  .list-edit li { display:flex; justify-content:space-between; align-items:center; padding:7px 0;
    border-bottom:1px solid var(--line); }
  .list-edit { list-style:none; padding:0; margin:0 0 10px; }
  .add-row { display:flex; gap:8px; }

  .rec-btn { background: linear-gradient(120deg, #9c4a2f, #c98a3a); color:#fff; border-color:transparent; padding:9px 18px;
    box-shadow: 0 6px 16px -6px rgba(156,74,47,.65); }
  .rec-btn.recording { background: linear-gradient(120deg, #8f2d1f, #c0582f); animation: glow 1.4s infinite; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(178,58,42,.55); } 50% { box-shadow: 0 0 0 10px rgba(178,58,42,0); } }
  #recStatus { display:inline-flex; align-items:center; gap:8px; }
  .eq { display:inline-flex; align-items:center; gap:3px; height:20px; }
  .eq i { display:block; width:4px; height:100%; border-radius:4px; background: linear-gradient(#c98a3a, #b5523b);
    transform-origin:center; animation: wave 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.2s; animation-duration: .8s; } .eq i:nth-child(3) { animation-delay: -.45s; animation-duration: 1.15s; }
  .eq i:nth-child(4) { animation-delay: -.1s; animation-duration: .9s; } .eq i:nth-child(5) { animation-delay: -.6s; animation-duration: 1.05s; }
  @keyframes wave { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  .rec-btn.recording svg.ic { animation: beat 1s ease-in-out infinite; }
  @keyframes beat { 50% { transform: scale(.75); } }
  #sumBtn { background: linear-gradient(120deg, #ecd39a, #d9b08c); color:#4e3015; border-color:transparent; }
  .interim:empty { display:none; }
  .c-dict > label { margin-top:16px; }
  .interim { color:var(--c); font-style:italic; min-height:1.4em; margin:10px 0; font-weight:600; }
  .hint { color:var(--muted); font-size:.9rem; margin:0 0 10px; }
  label.check { text-transform:none; letter-spacing:0; font-weight:600; font-size:.85rem;
    display:flex; align-items:center; gap:6px; margin:0; }
  label.check input { width:auto; accent-color: var(--c); }
  .checks { display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .sum-head { display:flex; align-items:center; gap:8px; margin:16px 0 6px; }
  .sum-head label { margin:0; flex:1; }

  .welcome { text-align:center; padding:44px 24px; }
  .welcome .big { font-size:3.4rem; animation: float 3s ease-in-out infinite; }
  .welcome h2 { justify-content:center; font-size:1.9rem; background: var(--sunrise); background-size: 220% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent; animation: drift 5s ease-in-out infinite alternate; }
  .welcome p { color:var(--muted); max-width:420px; margin:0 auto 20px; }
  @keyframes float { 50% { transform: translateY(-8px); } }


  /* ---------- custom dropdowns ---------- */
  .dd { position:relative; }
  .dd-native { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; clip-path: inset(50%); }
  .dd-btn { width:100%; justify-content:space-between; font-weight:600; background:var(--field); border-radius:12px;
    padding:9px 12px; text-align:left; color:var(--ink); }
  .dd-btn:hover { transform:none; }
  .dd-label { display:inline-block; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .dd-chev { color: var(--muted); transition: transform .5s cubic-bezier(.5,1.7,.4,1), color .3s; }
  .dd.open .dd-chev { transform: rotate(180deg); color: var(--c); }
  .dd.open .dd-btn { border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent); }
  .dd-list { --vc: var(--brand); position:fixed; z-index:80; margin:0; padding:6px; list-style:none; overflow:auto;
    background:var(--panel); color:var(--ink); border:2px solid var(--line); border-radius:14px; font-weight:600;
    box-shadow: 0 18px 40px -12px rgba(60,35,15,.4); transform-origin: top center; }
  .dd-list.up { transform-origin: bottom center; }
  .dd-list li { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 12px;
    border-radius:10px; cursor:pointer; transition: background .2s, padding .25s cubic-bezier(.3,1.6,.5,1); }
  .dd-list li.act, .dd-list li:hover { background: color-mix(in srgb, var(--vc) 15%, transparent); padding-left:17px; }
  .dd-list li.sel { color: var(--vc); }
  .dd-list li.add { color: var(--muted); font-style:italic; border-top:1px dashed var(--line); margin-top:4px; }
  .dd-list li svg.ic { color: var(--vc); }
  .dd-list li, .dd-list.closing li { animation-fill-mode: both; }
  .dd-list li { animation-delay: calc(var(--i) * 38ms); }
  .dd-list.closing li { animation-delay: calc(var(--i) * 15ms); }
  .dd-list.quick, .dd-list.quick li { animation:none !important; }
  @keyframes dd-fade { from { opacity:0; } } @keyframes dd-fade-out { to { opacity:0; } }

  /* falling leaves (event filter) */
  .dd-list.v-leaves { --vc:#7d8b3a; animation: dd-fade .25s; }
  .v-leaves li { animation: leaf .7s cubic-bezier(.3,.9,.4,1); }
  .v-leaves.closing { animation: dd-fade-out .38s forwards; } .v-leaves.closing li { animation: leaf-out .35s ease-in; }
  @keyframes leaf { 0% { opacity:0; transform: translate(-16px,-24px) rotate(-14deg); } 55% { opacity:1; transform: translate(6px,3px) rotate(4deg); }
    80% { transform: translate(-2px,0) rotate(-1.5deg); } 100% { transform:none; } }
  @keyframes leaf-out { to { opacity:0; transform: translate(12px,28px) rotate(14deg); } }
  /* hand of cards (speaker filter) */
  .dd-list.v-fan { --vc:#a86f5c; animation: dd-fade .2s; }
  .v-fan li { transform-origin: 0 50%; animation: fan .6s cubic-bezier(.3,1.4,.5,1); }
  .v-fan.closing { animation: dd-fade-out .38s forwards; } .v-fan.closing li { animation: fan-out .32s ease-in; }
  @keyframes fan { from { opacity:0; transform: rotate(-30deg) translateY(-10px) scale(.9); } }
  @keyframes fan-out { to { opacity:0; transform: rotate(-22deg) scale(.85); } }
  /* sunrise / sunset (AM-PM filter) */
  .dd-list.v-horizon { --vc:#c58a2c; animation: sunrise .55s cubic-bezier(.3,.8,.4,1);
    background: linear-gradient(180deg, color-mix(in srgb, #e6c06a 18%, var(--panel)), var(--panel) 60%); }
  .v-horizon li { animation: rise .55s cubic-bezier(.3,1.3,.5,1); }
  .v-horizon.closing { animation: sunset .38s ease-in forwards; }
  @keyframes sunrise { from { clip-path: circle(0% at 50% 100%); } to { clip-path: circle(150% at 50% 100%); } }
  @keyframes sunset { from { clip-path: circle(150% at 50% 100%); } to { clip-path: circle(0% at 50% 100%); } }
  @keyframes rise { from { opacity:0; transform: translateY(16px); } }
  /* flipping index cards (sort) */
  .dd-list.v-flip { --vc:#557487; perspective: 700px; animation: dd-fade .2s; }
  .v-flip li { transform-origin: top center; animation: cardflip .6s cubic-bezier(.3,1.3,.5,1); }
  .v-flip.closing { animation: dd-fade-out .38s forwards; } .v-flip.closing li { animation: cardflip-out .3s ease-in; }
  @keyframes cardflip { from { opacity:0; transform: rotateX(-100deg); } 70% { transform: rotateX(14deg); } }
  @keyframes cardflip-out { to { opacity:0; transform: rotateX(90deg); } }
  /* unrolling scroll (event type) */
  .dd-list.v-scroll { --vc:#b5523b; border-top:5px solid #9c4a2f; animation: unroll .55s cubic-bezier(.4,1.1,.4,1); }
  .dd-list.v-scroll.up { border-top-width:2px; border-bottom:5px solid #9c4a2f; animation-name: unroll-up; }
  .v-scroll li { animation: slide-r .45s ease-out; }
  .v-scroll.closing { animation: rollup .35s ease-in forwards; }
  @keyframes unroll { from { clip-path: inset(0 0 100% 0 round 14px); } to { clip-path: inset(0 0 0 0 round 14px); } }
  @keyframes unroll-up { from { clip-path: inset(100% 0 0 0 round 14px); } to { clip-path: inset(0 0 0 0 round 14px); } }
  @keyframes rollup { to { clip-path: inset(0 0 100% 0 round 14px); } }
  @keyframes slide-r { from { opacity:0; transform: translateX(-14px); } }
  /* typewriter (speaker names) */
  .dd-list.v-typewriter { --vc:#6f8b62; animation: dd-fade .15s; font-family: "Courier New", ui-monospace, monospace; }
  .v-typewriter li { animation: type .5s steps(14); }
  .v-typewriter.closing { animation: dd-fade-out .2s forwards; }
  @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  /* bubbles (roles) */
  .dd-list.v-bubbles { --vc:#5f8a86; animation: dd-fade .15s; }
  .v-bubbles li { animation: bubble .55s cubic-bezier(.3,1.7,.5,1); }
  .v-bubbles.closing { animation: dd-fade-out .3s forwards; } .v-bubbles.closing li { animation: bubble-pop .25s ease-out; }
  @keyframes bubble { from { opacity:0; transform: scale(.3); border-radius:50%; } }
  @keyframes bubble-pop { to { opacity:0; transform: scale(1.2); } }
  .swap-in { animation: swap-in .45s cubic-bezier(.3,1.5,.5,1); }
  @keyframes swap-in { from { opacity:0; transform: translateY(80%); } }

  /* ---------- a tap animation for every clickable thing ---------- */
  .logo { cursor:pointer; }
  .tap-wobble { animation: wobble .6s; }
  @keyframes wobble { 25% { transform: rotate(-12deg); } 50% { transform: rotate(9deg); } 75% { transform: rotate(-4deg); } }
  .tap-sliders svg circle:nth-of-type(1) { animation: knob-l .7s cubic-bezier(.3,1.5,.5,1); }
  .tap-sliders svg circle:nth-of-type(2) { animation: knob-r .7s cubic-bezier(.3,1.5,.5,1); }
  @keyframes knob-l { 45% { transform: translateX(-6px); } } @keyframes knob-r { 45% { transform: translateX(6px); } }
  .tap-jelly { animation: jelly .7s; } .tap-jelly svg { animation: spin-half .6s cubic-bezier(.3,1.4,.5,1); }
  @keyframes jelly { 30% { transform: scale(1.15,.85); } 45% { transform: scale(.9,1.1); } 60% { transform: scale(1.05,.95); } 75% { transform: scale(.98,1.02); } }
  @keyframes spin-half { to { transform: rotate(180deg); } }
  .tap-sprout { animation: sprout .7s; }
  @keyframes sprout { 35% { transform: translateY(-9px) scaleY(1.12); } 60% { transform: translateY(2px) scaleY(.94); } }
  .tap-sheen::after { content:""; position:absolute; inset:0; pointer-events:none; transform: translateX(-120%);
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.8) 50%, transparent 70%); animation: sweep .7s ease forwards; }
  .tap-sheen svg { animation: spin-full .7s cubic-bezier(.3,1.3,.5,1); }
  @keyframes spin-full { to { transform: rotate(360deg); } }
  .tap-spring { animation: spring .7s cubic-bezier(.3,1.8,.5,1); } .tap-spring svg { animation: spin-half .5s; }
  @keyframes spring { 40% { transform: translateY(-8px) scale(1.06); } }
  .tap-unfold { animation: unfold .6s; }
  @keyframes unfold { 30% { transform: scaleX(.75); } 60% { transform: scaleX(1.12); } 80% { transform: scaleX(.97); } }
  .tap-shoot-up svg { animation: shoot-up .5s; } .tap-shoot-down svg { animation: shoot-down .5s; }
  @keyframes shoot-up { 40% { transform: translateY(-9px); opacity:0; } 41% { transform: translateY(9px); opacity:0; } }
  @keyframes shoot-down { 40% { transform: translateY(9px); opacity:0; } 41% { transform: translateY(-9px); opacity:0; } }
  .tap-spin-out svg { animation: spin-out .4s forwards; }
  @keyframes spin-out { to { transform: rotate(270deg) scale(0); } }
  .tap-shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-4px) rotate(-10deg); } 40% { transform: translateX(4px) rotate(10deg); }
    60% { transform: translateX(-3px) rotate(-6deg); } 80% { transform: translateX(2px) rotate(3deg); } }
  .tap-bookmark svg { animation: bookmark .6s; }
  @keyframes bookmark { 30% { transform: translateY(-7px); } 60% { transform: translateY(2px); } }
  .fly-chip { position:fixed; z-index:90; pointer-events:none; display:flex; align-items:center; gap:6px; padding:6px 12px;
    border-radius:999px; background:#557487; color:#fff; font-weight:800; font-size:.85rem; box-shadow: 0 10px 24px -8px rgba(0,0,0,.4); }
  .tap-land { animation: land .7s; }
  @keyframes land { 30% { transform: scale(1.03); box-shadow: 0 0 0 6px rgba(85,116,135,.3); } }
  .tap-copy svg rect { animation: copy-f .6s; } .tap-copy svg path { animation: copy-b .6s; }
  @keyframes copy-f { 45% { transform: translate(-3px,-3px); } } @keyframes copy-b { 45% { transform: translate(2px,2px); } }
  .tap-layers svg path:first-child { animation: lay-up .6s; } .tap-layers svg path:last-child { animation: lay-dn .6s; }
  @keyframes lay-up { 45% { transform: translateY(-5px); } } @keyframes lay-dn { 45% { transform: translateY(3px); } }
  .tap-trash svg path:nth-child(-n+2) { transform-box: view-box; transform-origin: 4px 7px; animation: lid .8s; }
  @keyframes lid { 30%, 60% { transform: rotate(-28deg) translateY(-2px); } }
  .tap-print svg > :nth-child(3) { animation: feed .8s; } .tap-print svg > :nth-child(1) { animation: feed-top .8s; }
  @keyframes feed { 50% { transform: translateY(4px); } } @keyframes feed-top { 50% { transform: translateY(-2px); } }
  .tap-stamp { animation: stamp .45s; }
  @keyframes stamp { 30% { transform: scale(.82) rotate(-4deg); } 60% { transform: scale(1.08) rotate(2deg); } }
  .stamped { animation: stamped .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes stamped { from { opacity:0; transform: scale(1.4) rotate(-3deg); } }
  .tap-drop svg > :nth-child(-n+2) { animation: drop .6s; } .tap-lift svg > :nth-child(-n+2) { animation: lift .6s; }
  @keyframes drop { 50% { transform: translateY(5px); } } @keyframes lift { 50% { transform: translateY(-5px); } }
  .tap-flick svg { animation: flick .3s forwards; }
  @keyframes flick { to { transform: rotate(-90deg) scale(.5); } }
  .tap-squish { animation: squish .35s; }
  @keyframes squish { 40% { transform: scale(.97,.9); } }
  header h1 .logo.tap-halo { animation: halo-burst .9s ease-out; } .tap-halo svg { animation: glow-cross .9s; }
  @keyframes halo-burst { from { box-shadow: 0 0 0 0 rgba(255,236,190,.85), 0 0 0 0 rgba(255,236,190,.5); }
    to { box-shadow: 0 0 0 16px rgba(255,236,190,0), 0 0 0 32px rgba(255,236,190,0); } }
  @keyframes glow-cross { 40% { transform: scale(1.3); filter: drop-shadow(0 0 6px #fff); } }
  .note-item.tap-page { transform-origin: left center; animation: page .6s ease; }
  @keyframes page { 30% { transform: perspective(600px) rotateY(-18deg); } }
  .rec-btn.tap-rings, .rec-btn.recording.tap-rings { animation: rings 1s ease-out; }
  @keyframes rings { from { box-shadow: 0 0 0 0 rgba(181,82,59,.6), 0 0 0 0 rgba(201,138,58,.45); }
    to { box-shadow: 0 0 0 16px rgba(181,82,59,0), 0 0 0 32px rgba(201,138,58,0); } }
  .rec-btn.tap-squash { animation: squash .5s; }
  @keyframes squash { 30% { transform: scale(1.12,.84); } 55% { transform: scale(.94,1.06); } 80% { transform: scale(1.02,.98); } }
  .tap-flip { animation: flip-x .7s cubic-bezier(.4,1.2,.5,1); }
  @keyframes flip-x { from { transform: perspective(500px) rotateX(0); } to { transform: perspective(500px) rotateX(360deg); } }
  .tap-filled { animation: filled .7s; }
  @keyframes filled { 30% { background: color-mix(in srgb, var(--c) 22%, var(--field)); transform: scale(1.02); } }
  label.check input { appearance:none; -webkit-appearance:none; flex:none; width:20px; height:20px; padding:0; margin:0;
    border-radius:6px; display:grid; place-items:center; cursor:pointer; transition: background .25s, border-color .25s; }
  label.check input:checked { background: var(--c); border-color: var(--c); }
  label.check input:checked::after { content:""; width:9px; height:5px; border-left:2.5px solid #fff; border-bottom:2.5px solid #fff;
    transform: translateY(-1px) rotate(-45deg); animation: tick .3s ease-out; }
  @keyframes tick { from { width:0; height:0; } }
  .tap-check input { animation: chk-pop .5s cubic-bezier(.3,1.8,.5,1); }
  @keyframes chk-pop { 40% { transform: scale(1.35) rotate(-12deg); } }
  dialog.folding { animation: fold .32s ease-in forwards; }
  dialog.folding::backdrop { animation: fade-out .32s forwards; }
  @keyframes fold { to { opacity:0; transform: perspective(800px) rotateX(28deg) scale(.85) translateY(30px); } }
  @keyframes fade-out { to { opacity:0; } }

  /* =================== classic-modern theme =================== */
  h1, h2, h3, .title-input { letter-spacing: -.01em; }
  header { background: var(--solid); animation:none; color: var(--ink); border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(0,0,0,.02); }
  header h1 { text-shadow:none; font-weight:700; color: var(--ink); }
  header h1 .logo { color: var(--gold); border-radius:10px; background: var(--sunrise); box-shadow: 0 4px 12px -6px rgba(31,58,95,.6); }
  @keyframes halo { 50% { box-shadow: 0 4px 12px -6px rgba(31,58,95,.6), 0 0 0 4px rgba(201,162,39,.16); } }
  header button { background: var(--solid); color: var(--ink); border-color: var(--line); }
  header button:hover { background: var(--field); border-color: color-mix(in srgb, var(--brand) 35%, var(--line)); }
  header button.primary, header button.primary:hover { background: var(--brand); color:#fff; border-color: var(--brand);
    box-shadow: 0 4px 12px -6px rgba(31,58,95,.55); }
  :root[data-theme="dark"] header button.primary { background:#2c4f7c; border-color:#2c4f7c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) header button.primary { background:#2c4f7c; border-color:#2c4f7c; } }

  button { border-width:1px; border-color: var(--line); background: var(--solid); font-weight:600; }
  button:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  button.primary { background: var(--brand); box-shadow: 0 4px 12px -6px rgba(31,58,95,.5); }
  input, select, textarea { border-width:1px; border-color: var(--line); background: var(--field); }
  input:focus, select:focus, textarea:focus { border-color: color-mix(in srgb, var(--c) 65%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 16%, transparent); }
  label { font-weight:600; letter-spacing:.07em; font-size:.7rem; }

  aside { background: var(--solid); border-right:1px solid var(--line); }
  .filters { background: var(--solid); border-bottom:1px solid var(--line); }
  .note-item { background: var(--panel); border:1px solid var(--line); border-left:3px solid hsl(var(--h) 42% 45%); }
  .note-item.active { border-color: hsl(var(--h) 42% 50%); background: hsl(var(--h) 40% var(--active));
    box-shadow: 0 6px 16px -10px hsl(var(--h) 40% 30% / .6); }
  .note-item .t { font-weight:700; }
  .tag { background: hsl(var(--h) 45% var(--tag-bg)); color: hsl(var(--h) 45% var(--tag-fg)); font-weight:600; }
  .pill-ampm { font-weight:600; }
  .pill-ampm.am { background: var(--am-bg); color: var(--am-fg); }
  .pill-ampm.pm { background: var(--pm-bg); color: var(--pm-fg); }

  .card { background: var(--panel); border:1px solid var(--line); }
  .card::before { height:3px; background: var(--c); opacity:.85; }
  .card:focus-within::before { height:3px; opacity:1; }
  .card:focus-within { border-color: color-mix(in srgb, var(--c) 35%, var(--line)); box-shadow: 0 10px 28px -16px color-mix(in srgb, var(--c) 55%, transparent); }
  .card h2 { font-weight:600; font-size:1.2rem; }
  .card h2 .badge { color: var(--c); border-radius:10px; background: color-mix(in srgb, var(--c) 11%, transparent); }
  .card.c-main { --c: #1f3a5f; } .card.c-main::before { background: linear-gradient(90deg, #1f3a5f, #c9a227); }
  .card.c-dict { --c: #1f3a5f; } .card.c-speak { --c: #8c2f39; } .card.c-scrip { --c: #2f6f73; }
  .card.c-notes { --c: #5b7f4e; } .card.c-act { --c: #a8761a; } .card.c-pray { --c: #6b4c7a; }
  :root[data-theme="dark"] .card.c-dict, :root[data-theme="dark"] .card.c-main { --c: #8fb0d9; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card.c-dict, :root:not([data-theme="light"]) .card.c-main { --c: #8fb0d9; } }
  /* brighter section colors so they read well on the dark background */
  :root[data-theme="dark"] .card.c-speak { --c:#e08a95; } :root[data-theme="dark"] .card.c-scrip { --c:#6cbcc0; } :root[data-theme="dark"] .card.c-notes { --c:#9cc48b; } :root[data-theme="dark"] .card.c-act { --c:#e6b55a; } :root[data-theme="dark"] .card.c-pray { --c:#c3a3d6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card.c-speak { --c:#e08a95; } :root:not([data-theme="light"]) .card.c-scrip { --c:#6cbcc0; } :root:not([data-theme="light"]) .card.c-notes { --c:#9cc48b; } :root:not([data-theme="light"]) .card.c-act { --c:#e6b55a; } :root:not([data-theme="light"]) .card.c-pray { --c:#c3a3d6; } }
  .section { border:1px dashed color-mix(in srgb, var(--c) 35%, var(--line)); background: color-mix(in srgb, var(--c) 4%, transparent); }
  .title-input { font-weight:700; font-size:1.9rem; }

  .seg { border-width:1px; border-color: var(--line); }
  .seg::before { background: linear-gradient(135deg, #f2d27a, #e0b04a); box-shadow: 0 3px 10px -5px rgba(168,118,26,.7); }
  .seg.pm::before { background: linear-gradient(135deg, #1f3a5f, #2f4f7a); box-shadow: 0 3px 10px -5px rgba(31,58,95,.8); }
  .seg button { background: transparent !important; }
  .seg button.on[data-p="AM"] { color:#3d2a05; }

  .rec-btn { background: #8c2f39; box-shadow: 0 4px 12px -6px rgba(140,47,57,.7); }
  .rec-btn.recording { background: #b3261e; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgba(179,38,30,.45); } 50% { box-shadow: 0 0 0 9px rgba(179,38,30,0); } }
  #sumBtn { background: #f4e7c3; color:#5a420d; border-color: #ead8a4; box-shadow:none; }
  .eq i { background: linear-gradient(#c9a227, #1f3a5f); }
  .shine-wrap.shine::after { background: linear-gradient(100deg, transparent 30%, rgba(201,162,39,.28) 50%, transparent 70%); }

  dialog { background: var(--solid); border:1px solid var(--line); border-radius:18px; }
  dialog::backdrop { background: rgba(20,22,30,.42); backdrop-filter: blur(2px); }
  .dd-btn { border-width:1px; }
  .dd-list { background: var(--solid); border:1px solid var(--line); box-shadow: 0 18px 40px -18px rgba(31,36,51,.4); }
  .dd-list.v-leaves { --vc:#5b7f4e; } .dd-list.v-fan { --vc:#8c2f39; } .dd-list.v-flip { --vc:#2f6f73; }
  .dd-list.v-horizon { --vc:#a8761a; background: linear-gradient(180deg, color-mix(in srgb, #f2d27a 16%, var(--solid)), var(--solid) 65%); }
  .dd-list.v-scroll { --vc:#1f3a5f; border-top:4px solid #1f3a5f; } .dd-list.v-scroll.up { border-bottom:4px solid #1f3a5f; }
  .dd-list.v-typewriter { --vc:#5b7f4e; } .dd-list.v-bubbles { --vc:#2f6f73; }
  .fly-chip { background:#1f3a5f; box-shadow: 0 10px 22px -8px rgba(31,58,95,.5); }
  @keyframes land { 30% { transform: scale(1.02); box-shadow: 0 0 0 5px color-mix(in srgb, var(--c, #1f3a5f) 22%, transparent); } }
  @keyframes halo-burst { from { box-shadow: 0 0 0 0 rgba(201,162,39,.7), 0 0 0 0 rgba(31,58,95,.4); }
    to { box-shadow: 0 0 0 14px rgba(201,162,39,0), 0 0 0 28px rgba(31,58,95,0); } }
  @keyframes rings { from { box-shadow: 0 0 0 0 rgba(140,47,57,.5), 0 0 0 0 rgba(201,162,39,.4); }
    to { box-shadow: 0 0 0 14px rgba(140,47,57,0), 0 0 0 28px rgba(201,162,39,0); } }
  .toast { background: #1f2433; color:#f7f5f1; }
  .welcome h2 { font-size:2.1rem; background:none; color: var(--brand); -webkit-text-fill-color: currentColor; animation:none; }
  label.check input:checked { background: var(--c); border-color: var(--c); }
  /* =================== palette: #14161C #5A6070 #E6E8EE #FAF9F6 =================== */
  header h1 .logo { color: var(--paper); background: var(--ink-c); box-shadow: 0 4px 12px -6px rgba(20,22,28,.6); }
  :root[data-theme="dark"] header h1 .logo { color: var(--ink-c); background: var(--mist); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) header h1 .logo { color: var(--ink-c); background: var(--mist); } }
  @keyframes halo { 50% { box-shadow: 0 4px 12px -6px rgba(20,22,28,.6), 0 0 0 4px color-mix(in srgb, #5A6070 22%, transparent); } }
  header button.primary, header button.primary:hover, button.primary,
  :root[data-theme="dark"] header button.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); box-shadow: 0 4px 12px -6px rgba(20,22,28,.5); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) header button.primary { background: var(--brand); border-color: var(--brand); } }
  header button.primary svg.ic { color: var(--on-brand); }
  button:hover { border-color: var(--accent); }

  .card, .card.c-main, .card.c-dict, .card.c-speak, .card.c-scrip, .card.c-notes, .card.c-act, .card.c-pray,
  :root[data-theme="dark"] .card[class*="c-"] { --c: var(--ink); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card[class*="c-"] { --c: var(--ink); } }
  .card::before, .card.c-main::before { background: var(--accent); height:3px; opacity:1; }
  .card.c-main::before { background: var(--ink); }

  'Conference','Youth Service','Women\'s Ministry','Men\'s Ministry','Special Event','Funeral','Wedding'];
const DEFAULT_SECTIONS = ['Main Points','Key Quotes','Personal Reflection'];


// repair anything missing or malformed (older versions, imports, hand-edited backups)
const str = v => typeof v === 'string' ? v : v == null ? '' : String(v);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strList = a => Array.isArray(a) ? [...new Set(a.map(str).map(x => x.trim()).filter(Boolean))] : [];
function normNote(n) {
  const out = {
    id: str(n.id) || uid(), title: str(n.title), date: str(n.date), period: n.period === 'PM' ? 'PM' : 'AM',
    eventType: str(n.eventType), location: str(n.location),
    speakers: Array.isArray(n.speakers) && n.speakers.length ? n.speakers.map(x => ({ name: str(x?.name), role: str(x?.role) })) : [{ name: '', role: '' }],
    scripture: str(n.scripture), notesHtml: '', updated: +n.updated || Date.now()
  };

// show which formatting is on where the cursor is
function rtState() {
  const tb = document.querySelector('.rt-toolbar'); if (!tb) return;
  ['bold', 'italic', 'underline', 'strikeThrough', 'justifyLeft', 'justifyCenter', 'justifyRight'].forEach(c => {
    let on = false; try { on = document.queryCommandState(c); } catch {}
    tb.querySelector(`[data-cmd="${c}"]`)?.classList.toggle('on', on);
  });
  const li = rtBlockEl()?.closest('li'), kind = li ? listKind(li.parentNode) : '';
  tb.querySelector('[data-cmd="insertUnorderedList"]')?.classList.toggle('on', kind === 'ul');
  tb.querySelector('[data-cmd="insertOrderedList"]')?.classList.toggle('on', kind === 'ol');
  tb.querySelector('[data-cmd="checklist"]')?.classList.toggle('on', kind === 'check');
  const sel = $('blockStyle'); if (!sel) return;
  const v = (rtBlockEl()?.tagName || 'p').toLowerCase();
  const val = ['h1', 'h2', 'h3', 'blockquote'].includes(v) ? v : 'p';
  if (sel.value !== val) { sel.value = val; syncSelect(sel); }
}

/* ---------- note actions (the ⋯ menu at the top of a note) ---------- */
const NOTE_ACTIONS = [
  { label: 'Print / PDF', value: 'print', icon: 'print' },
  { label: 'Copy as text', value: 'copy', icon: 'copy' },
  { label: 'Duplicate', value: 'duplicate', icon: 'layers' },
  { label: 'Delete note', value: 'delete', icon: 'trash' }];
function openNoteMenu(btn) {
  btn.setAttribute('aria-expanded', 'true');
  openPanel(btn, NOTE_ACTIONS, 'deck', it => noteAction(it.value));
}
function noteAction(what) {
  const n = current(); if (!n) return;
  if (what === 'print') setTimeout(() => window.print(), 250);
  else if (what === 'copy') {
    (navigator.clipboard ? navigator.clipboard.writeText(noteToText(n)) : Promise.reject())
      .then(() => toast('Copied the note as text.', 2200), () => toast('Your browser blocked copying. Try Print / PDF instead.', 4000));
  }
  else if (what === 'duplicate') {
    const copy = JSON.parse(JSON.stringify(n)); copy.id = uid(); copy.title = (n.title || 'Untitled') + ' (copy)';
    state.notes.unshift(copy); currentId = copy.id; justAdded = copy.id; persist(); render(); justAdded = null;
    toast('Duplicated. You’re now editing the copy.', 2600);
  }
  else if (what === 'delete') {
    if (confirm(`Delete “${n.title || 'Untitled sermon'}” permanently?`)) fallAway(() => {
      state.notes = state.notes.filter(x => x.id !== n.id); currentId = state.notes[0]?.id || null; persist(); render();
      toast('Note deleted.', 2200);
    });
  }
}

function noteToText(n) {
  const lines = [n.title || 'Untitled sermon', `${fmtDate(n.date)} (${n.period}) — ${n.eventType}`];
  if (n.scripture.trim()) lines.push('Scripture: ' + n.scripture.trim());
  const sp = n.speakers.filter(s => s.name.trim());
  if (sp.length) lines.push('Speakers: ' + sp.map(s => s.name + (s.role ? ` (${s.role})` : '')).join(', '));
  const body = htmlToText(n.notesHtml);
  if (body) lines.push('', body);
  return lines.join('\n');
}

/* ---------- Manage lists ---------- */
function renderManage() {
  const li = (arr, kind) => arr.map((x, i) => `<li><span>${esc(x)}</span><button class="icon danger" data-rm="${kind}:${i}">${ic('x')}</button></li>`).join('')
    || '<li style="color:var(--muted)">None yet</li>';
  $('speakerList').innerHTML = li(state.speakers, 'speakers');
  $('eventList').innerHTML = li(state.eventTypes, 'eventTypes');
}
$('manageBtn').onclick = () => { renderManage(); $('manageDlg').showModal(); };
$('closeManage').onclick = () => {
  const d = $('manageDlg'), fin = () => { d.classList.remove('folding'); d.close(); };
  if (REDUCE) return fin();
  d.classList.add('folding'); setTimeout(fin, 320);
};
$('manageDlg').addEventListener('close', () => render());   // also when closed with Esc
$('manageDlg').addEventListener('click', e => {
  const b = e.target.closest('[data-rm]'); if (!b) return;
  const [k, i] = b.dataset.rm.split(':'), row = b.closest('li');
  const go = () => { state[k].splice(+i, 1); persist(); renderManage(); };
  if (REDUCE) return go();
  row.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateX(-70px) rotate(-3deg)', opacity: 0 }],
    { duration: 300, easing: 'ease-in', fill: 'forwards' }).onfinish = go;
});
function addTo(kind, input) {
  const v = $(input).value.trim(); if (!v) return;
  if (!state[kind].includes(v)) state[kind].push(v);
  $(input).value = ''; persist(); renderManage();
  const list = kind === 'speakers' ? '#speakerList' : '#eventList';
  play(document.querySelector(`${list} li:last-child`), 'stamped', 700);
}
$('addSpeakerBtn').onclick = () => addTo('speakers', 'newSpeaker');
$('addEventBtn').onclick = () => addTo('eventTypes', 'newEvent');
$('newSpeaker').onkeydown = e => e.key === 'Enter' && addTo('speakers', 'newSpeaker');
$('newEvent').onkeydown = e => e.key === 'Enter' && addTo('eventTypes', 'newEvent');

$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `sermon-notes-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Backup saved to your downloads.');
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const raw = JSON.parse(await f.text());
    if (!raw || !Array.isArray(raw.notes)) throw new Error('this isn’t a Sermon Notes backup file');
    const data = normState(raw), ids = new Set(state.notes.map(n => n.id));
    const fresh = data.notes.filter(n => !ids.has(n.id));
    state.notes.push(...fresh);
    state.speakers = [...new Set([...state.speakers, ...data.speakers])];
    state.eventTypes = [...new Set([...state.eventTypes, ...data.eventTypes])];
    if (!currentId && state.notes.length) currentId = state.notes[0].id;
    persist(); renderManage(); render();
    toast(fresh.length ? `Imported ${fresh.length} note${fresh.length > 1 ? 's' : ''}.` : 'Those notes are already here, nothing new to import.');
  } catch (err) { toast('Could not import: ' + err.message, 7000); }
  e.target.value = '';
};

/* ---------- Custom dropdowns: each one opens with its own animation ---------- */
const ROLES = ['Pastor', 'Guest Speaker', 'Evangelist', 'Youth Pastor', 'Elder', 'Deacon', 'Worship Leader', 'Minister', 'Teacher'];
const DD_VARIANT = { filterEvent: 'leaves', filterSpeaker: 'fan', filterPeriod: 'horizon', sortBy: 'flip', eventType: 'scroll', blockStyle: 'type' };
let PANEL = null;   // the one open dropdown list: { el, anchor, items, active, onPick, variant }

function openPanel(anchor, items, variant, onPick, selected = -1, quick = false) {
  const reuse = PANEL && PANEL.anchor === anchor;
  if (PANEL && !reuse) closePanel(true);
  const el = reuse ? PANEL.el : document.createElement('ul');
  el.className = `dd-list v-${variant}${quick || reuse ? ' quick' : ''}`;
  el.setAttribute('role', 'listbox');
  el.innerHTML = items.map((it, i) => `<li role="option" id="ddo-${i}" data-i="${i}" style="--i:${Math.min(i, 12)}"
      class="${i === selected ? 'sel' : ''}${it.value === '__new' ? ' add' : ''}${it.value === 'delete' ? ' danger' : ''}" aria-selected="${i === selected}">
      <span>${it.swatch ? `<i class="sw" style="background:${it.swatch}"></i>` : ''}${it.icon ? ic(it.icon) : ''}${esc(it.label)}</span>${i === selected ? ic('check', 'draw-now') : ''}</li>`).join('');
  if (!reuse) document.body.appendChild(el);
  PANEL = { el, anchor, items, active: selected, onPick, variant };
  placePanel(); setActive(selected);
  anchor.setAttribute('aria-expanded', 'true');
  anchor.closest('.dd')?.classList.add('open');
}
function placePanel() {
  if (!PANEL) return;
  const r = PANEL.anchor.getBoundingClientRect(), el = PANEL.el;
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - Math.max(r.width, 200) - 8)) + 'px';
  el.style.minWidth = Math.max(r.width, 180) + 'px';
  if (PANEL.anchor.id === 'noteMenuBtn') el.style.left = Math.max(8, r.right - el.offsetWidth) + 'px';   // line up with the button's right edge
  const below = innerHeight - r.bottom - 12, above = r.top - 12, up = below < 220 && above > below;
  el.style.maxHeight = Math.min(330, up ? above : below) + 'px';
  el.style.top = up ? '' : (r.bottom + 6) + 'px';
  el.style.bottom = up ? (innerHeight - r.top + 6) + 'px' : '';
  el.classList.toggle('up', up);
}
function closePanel(instant = false) {
  if (!PANEL) return;
  const { el, anchor } = PANEL; PANEL = null;
  if (anchor.id === 'noteMenuBtn') anchor.setAttribute('aria-expanded', 'false');
  anchor.setAttribute('aria-expanded', 'false'); anchor.removeAttribute('aria-activedescendant');
  anchor.closest('.dd')?.classList.remove('open');
  if (instant || REDUCE) return el.remove();
  el.classList.add('closing'); el.style.pointerEvents = 'none';
  setTimeout(() => el.remove(), 380);
}
function setActive(i) {
  if (!PANEL) return;
  PANEL.active = i;
  PANEL.el.querySelectorAll('li').forEach(li => li.classList.toggle('act', +li.dataset.i === i));
  const li = PANEL.el.querySelector(`li[data-i="${i}"]`);
  if (li) { li.scrollIntoView({ block: 'nearest' }); PANEL.anchor.setAttribute('aria-activedescendant', li.id); }
}
function pickPanel(i) {
  if (!PANEL || !PANEL.items[i]) return;
  const { onPick, items } = PANEL; closePanel(); onPick(items[i]);
}
document.addEventListener('pointerdown', e => {
  if (PANEL && !PANEL.el.contains(e.target) && !PANEL.anchor.contains(e.target)) closePanel();
});
document.addEventListener('click', e => {
  const li = e.target.closest('.dd-list li'); if (li && PANEL && PANEL.el.contains(li)) pickPanel(+li.dataset.i);
});
document.addEventListener('mousedown', e => { if (e.target.closest('.dd-list')) e.preventDefault(); }); // keep focus in the field
window.addEventListener('resize', () => placePanel());
document.addEventListener('scroll', e => { if (PANEL && !PANEL.el.contains(e.target)) placePanel(); }, true);

// turn a <select> into an animated dropdown (the real select stays, hidden, so everything else keeps working)
function enhanceSelects() {
  document.querySelectorAll('select:not(.dd-native)').forEach(sel => {
    const variant = DD_VARIANT[sel.id] || DD_VARIANT[sel.dataset.f] || 'leaves';
    const wrap = document.createElement('div'); wrap.className = `dd v-${variant}`;
    sel.before(wrap); wrap.appendChild(sel); sel.classList.add('dd-native'); sel.tabIndex = -1; sel.setAttribute('aria-hidden', 'true');
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'dd-btn';
    btn.setAttribute('aria-haspopup', 'listbox'); btn.setAttribute('aria-expanded', 'false');
    btn.innerHTML = `<span class="dd-label"></span>${ic('chev', 'dd-chev')}`;
    wrap.appendChild(btn); syncSelect(sel);
  });
}
const DD_NAMES = { blockStyle: 'Text style', filterEvent: 'Filter by event type', filterSpeaker: 'Filter by speaker', filterPeriod: 'Filter by AM or PM', sortBy: 'Sort notes', eventType: 'Event type' };
function syncSelect(sel) {
  const lab = sel.closest('.dd')?.querySelector('.dd-label'); if (!lab) return;
  const t = sel.selectedOptions[0]?.text || '';
  if (lab.textContent !== t) lab.textContent = t;
  lab.parentElement.setAttribute('aria-label', `${DD_NAMES[sel.id || sel.dataset.f] || 'Choose'}: ${t}`);
}
function openSelect(btn) {
  const sel = btn.closest('.dd').querySelector('select'), variant = btn.closest('.dd').className.match(/v-(\w+)/)[1];
  const items = [...sel.options].map(o => ({ label: o.text, value: o.value }));
  openPanel(btn, items, variant, it => {
    sel.value = it.value; syncSelect(sel);
    const lab = btn.querySelector('.dd-label'); play(lab, 'swap-in', 500);
    sel.dispatchEvent(new Event('input', { bubbles: true })); sel.dispatchEvent(new Event('change', { bubbles: true }));
    if (sel.id === 'blockStyle') rtFocus();          // keep typing right where you were in your notes
    else if (btn.isConnected) btn.focus();
  }, sel.selectedIndex);
}
document.addEventListener('click', e => {
  const btn = e.target.closest('.dd-btn'); if (!btn) return;
  PANEL && PANEL.anchor === btn ? closePanel() : openSelect(btn);
});
document.addEventListener('keydown', e => {
  const btn = e.target.closest?.('.dd-btn, #noteMenuBtn'), inp = e.target.closest?.('[data-s]');
  const openBtn = b => b.id === 'noteMenuBtn' ? openNoteMenu(b) : openSelect(b);
  if (!btn && !inp) return;
  const open = PANEL && PANEL.anchor === e.target, n = open ? PANEL.items.length : 0;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!open) return btn ? openBtn(btn) : suggest(inp, true);
    setActive((PANEL.active + (e.key === 'ArrowDown' ? 1 : -1) + n) % n);
  } else if ((e.key === 'Enter' || (btn && e.key === ' ')) && open && PANEL.active >= 0) { e.preventDefault(); pickPanel(PANEL.active); }
  else if (btn && (e.key === 'Enter' || e.key === ' ') && !open) { e.preventDefault(); openBtn(btn); }
  else if (e.key === 'Escape' && open) { e.preventDefault(); closePanel(); }
  else if (e.key === 'Tab' && open) closePanel(true);
});

// speaker name / role suggestions
function suggest(inp, force = false) {
  const kind = inp.dataset.s, q = inp.value.trim().toLowerCase();
  const pool = kind === 'name' ? state.speakers : ROLES;
  const items = pool.filter(x => (force || !q || x.toLowerCase().includes(q)) && x.toLowerCase() !== q).slice(0, 8).map(x => ({ label: x, value: x }));
  if (!items.length) { if (PANEL && PANEL.anchor === inp) closePanel(); return; }
  openPanel(inp, items, kind === 'name' ? 'typewriter' : 'bubbles', it => {
    inp.value = it.value; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
    play(inp, 'tap-filled', 700);
  }, -1, PANEL && PANEL.anchor === inp);
}
document.addEventListener('focusin', e => { const inp = e.target.closest('[data-s]'); if (inp) suggest(inp, true); });
document.addEventListener('input', e => { const inp = e.target.closest('[data-s]'); if (inp && e.isTrusted) suggest(inp); });
document.addEventListener('focusout', e => {
  const inp = e.target.closest('[data-s]'); if (inp) setTimeout(() => { if (PANEL && PANEL.anchor === inp && document.activeElement !== inp) closePanel(); }, 120);
});

/* ---------- A unique tap animation for everything you can click ---------- */
function play(el, cls, ms = 800) {
  if (!el || REDUCE) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  clearTimeout(el['_t' + cls]); el['_t' + cls] = setTimeout(() => el.classList.remove(cls), ms);
}
// [how to find the button, how to find it again after a re-render, animation class]
const TAPS = [
  ['#menuBtn', () => $('menuBtn'), 'tap-wobble'],
  ['#manageBtn', () => $('manageBtn'), 'tap-sliders'],
  ['#newBtn', () => $('newBtn'), 'tap-jelly'],
  ['#addSpeaker', () => $('addSpeaker'), 'tap-spring'],
  ['[data-del-speaker]', null, 'tap-spin-out'],
  ['#addSpeakerBtn, #addEventBtn', null, 'tap-stamp'],
  ['#noteMenuBtn', () => $('noteMenuBtn'), 'tap-dots'],
  ['#exportBtn', null, 'tap-drop'],
  ['#importBtn', null, 'tap-lift'],
  ['[data-rm]', null, 'tap-flick'],
  ['.dd-btn', null, 'tap-squish'],
  ['.logo', null, 'tap-halo'],
  ['.note-item', b => document.querySelector(`.note-item[data-id="${b.dataset.id}"]`), 'tap-page'],
];
// each formatting button moves its own way
const TOOL_TAP = { bold: 'tap-bold', italic: 'tap-italic', underline: 'tap-underline', strikeThrough: 'tap-strike', undo: 'tap-undo', redo: 'tap-redo',
  color: 'tap-swatch', highlight: 'tap-marker', insertUnorderedList: 'tap-list', insertOrderedList: 'tap-list', checklist: 'tap-tick',
  justifyLeft: 'tap-al', justifyCenter: 'tap-ac', justifyRight: 'tap-ar', indent: 'tap-in', outdent: 'tap-out',
  link: 'tap-linkspin', insertHorizontalRule: 'tap-hr', removeFormat: 'tap-erase' };
document.addEventListener('click', e => {
  const tool = e.target.closest('.rt-toolbar [data-cmd]');
  if (tool) { play(tool, TOOL_TAP[tool.dataset.cmd] || 'tap-squish', 700); return; }
  for (const [sel, refind, cls] of TAPS) {
    const hit = e.target.closest(sel); if (!hit) continue;
    const el = hit.isConnected ? hit : refind && refind(hit);
    play(el, cls, 900);
    break;
  }
});
// formatting buttons must not take the cursor out of the notes
document.addEventListener('mousedown', e => { if (e.target.closest('.rt-toolbar button')) e.preventDefault(); });
document.addEventListener('change', e => {
  if (e.target.matches('[data-f="date"]')) play(e.target, 'tap-flip', 800);
  if (e.target.matches('label.check input')) play(e.target.closest('label'), 'tap-check', 700);
});

// welcome button: let it sprout for a moment before the first note opens
function startFirst(btn) { if (btn.disabled) return; btn.disabled = true; seedBurst(btn); play(btn, 'tap-sprout', 900); setTimeout(newNote, REDUCE ? 0 : 420); }

// deleting a note: its cards tumble away first
function fallAway(done) {
  const cards = [...document.querySelectorAll('#editor .card')];
  if (REDUCE || !cards.length) return done();
  cards.forEach((c, i) => c.animate([{ transform: 'none', opacity: 1 },
    { transform: `translateY(${120 + i * 20}px) rotate(${(i % 2 ? 1 : -1) * (4 + i * 2)}deg)`, opacity: 0 }],
    { duration: 520, delay: i * 55, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }));
  setTimeout(done, 520 + cards.length * 55);
}
// removing a section crumples it (speakers slide away instead)
function crumple(el, done) {
  if (!el || REDUCE) return done();
  el.style.overflow = 'hidden';
  el.animate([{ transform: 'none', opacity: 1, height: el.offsetHeight + 'px' },
    { transform: 'scale(.92) rotate(-2deg)', opacity: .7, offset: .4 },
    { transform: 'scale(.3) rotate(8deg)', opacity: 0, height: '0px', marginBottom: '0px', paddingTop: '0px', paddingBottom: '0px' }],
    { duration: 480, easing: 'cubic-bezier(.6,0,.4,1)' }).onfinish = done;
}

/* ---------- Boot ---------- */
// save immediately if the page is closed or hidden before the autosave delay
const flush = () => { clearTimeout(saveTimer); persist(); };
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => document.visibilityState === 'hidden' && flush());
$('newBtn').onclick = () => { seedBurst($('newBtn')); newNote(); };
$('menuBtn').onclick = () => setSidebar(!$('sidebar').classList.contains('open'));
// swap the placeholder spans in the static HTML for the hand-drawn icons
document.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
enhanceSelects();
// theme: automatic (follows the phone) → light → dark
const THEME_ICON = { auto: 'contrast', light: 'sun', dark: 'moon' }, THEME_NAME = { auto: 'Automatic', light: 'Light', dark: 'Dark' };
function applyTheme(animate) {
  const t = state.settings.theme, root = document.documentElement;
  if (animate && !REDUCE) { root.classList.add('theme-fade'); setTimeout(() => root.classList.remove('theme-fade'), 500); }
  if (t === 'auto') delete root.dataset.theme; else root.dataset.theme = t;
  const b = $('themeBtn'); b.innerHTML = ic(THEME_ICON[t]); b.setAttribute('aria-label', 'Theme: ' + THEME_NAME[t]); b.title = 'Theme: ' + THEME_NAME[t];
}
$('themeBtn').onclick = () => {
  const order = ['auto', 'light', 'dark'];
  state.settings.theme = order[(order.indexOf(state.settings.theme) + 1) % 3]; persist(); applyTheme(true);
  play($('themeBtn'), 'tap-themeflip', 800); toast('Theme: ' + THEME_NAME[state.settings.theme], 1600);
};
applyTheme(false);
const syncHeader = () => document.documentElement.style.setProperty('--header-h', document.querySelector('header').offsetHeight + 'px');
syncHeader(); window.addEventListener('resize', syncHeader);
if (loadProblem) setTimeout(() => toast('Some saved notes couldn’t be read. A copy of the original data was kept safe on this device.', 9000), 800);
if (storageProblem) setTimeout(() => toast('This browser is blocking storage, so notes won’t be kept after you close it. Use Lists → Export to save a backup.', 9000), 800);
// work offline (and open instantly) once installed or visited over https
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
function render() {
  renderFilters(); renderList(); renderEditor(); }
render();
</script>
